<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming & Reader Kitab Digital</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Navigasi & Kontrol Atas -->
    <header class="navbar">
        <div class="brand">
            <i data-lucide="book-open-check"></i>
            <span>Majelis Stream Kitab</span>
        </div>
        <div class="controls-top">
            <div class="input-group">
                <i data-lucide="youtube"></i>
                <input type="text" id="yt-url-input" placeholder="URL Live YouTube / Video ID..." />
                <button id="btn-load-yt">Muat Stream</button>
            </div>
            <div class="input-group">
                <i data-lucide="file-text"></i>
                <label for="pdf-file-input" class="btn-file-label">Buka PDF Kitab</label>
                <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
            </div>
            <button id="theme-toggle" class="btn-icon" title="Ubah Tema">
                <i data-lucide="sun"></i>
            </button>
        </div>
    </header>

    <!-- Tata Letak Utama (Dual Panel) -->
    <main class="main-layout">
        <!-- Panel Kiri: Pemutar Stream YouTube & Running Text -->
        <section class="panel panel-left">
            <div class="stream-container">
                <iframe id="yt-player" src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                
                <!-- Overlay badge di atas video -->
                <div class="stream-overlay">
                    <span class="live-badge"><i data-lucide="radio"></i> LIVE</span>
                    <span id="stream-title">Pengajian Kitab Online</span>
                </div>
            </div>

            <!-- Running Text / Teks Berjalan -->
            <div class="marquee-bar">
                <div class="marquee-content">
                    Selamat Datang di Pengajian Online • Silahkan muat kitab PDF pada panel sebelah kanan • Jangan lupa subscribe channel YouTube ini.
                </div>
            </div>
        </section>

        <!-- Panel Kanan: PDF Viewer & Control Bar -->
        <section class="panel panel-right">
            <div class="pdf-toolbar">
                <button id="prev-page" class="btn-nav" title="Halaman Sebelumnya"><i data-lucide="chevron-left"></i></button>
                <div class="page-info">
                    <span>Hal</span>
                    <input type="number" id="page-num" value="1" min="1" />
                    <span>/ <span id="page-count">-</span></span>
                </div>
                <button id="next-page" class="btn-nav" title="Halaman Selanjutnya"><i data-lucide="chevron-right"></i></button>
                <div class="divider"></div>
                <button id="zoom-out" class="btn-nav" title="Perkecil"><i data-lucide="zoom-out"></i></button>
                <span id="zoom-level">120%</span>
                <button id="zoom-in" class="btn-nav" title="Perbesar"><i data-lucide="zoom-in"></i></button>
            </div>
            
            <div class="pdf-scroll-container">
                <canvas id="pdf-render-canvas"></canvas>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
