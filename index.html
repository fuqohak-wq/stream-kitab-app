    .live-badge::before {
      content: '';

      height: 8px;

      border-radius: 50%;

    .mode-switch {

      border-radius: 6px;
      padding: 2px;
    }

    .mode-btn {

      border: none;

      cursor: pointer;
      font-size: 0.8rem;
    }

    .mode-btn.active {
      background-color: var(--accent-blue);
      color: white;
    }

    .stream-viewport {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

    /* Container khusus jika ingin style foto/frame kyai ala Gambar Kiri */
    .banner-overlay {

      left: 0;

      flex: 1;

      align-items: center;

      align-items: center;
      gap: 8px;

    .pdf-container {
      flex: 1;

      justify-content: center;
      align-items: flex-start;
      padding: 15px;

    #pdf-canvas {

      background-color: white;
      max-width: 100%;
    }

    /* Hidden File Input */
    #pdf-upload-input {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Controls -->

      <button class="btn btn-secondary" id="btn-webcam">🎥 Gunakan Kamera</button>
      <label class="btn">

        <input type="file" id="upload-pdf" accept="application/pdf">
      </label>
    </div>
  </header>

  <!-- Live Broadcast Layout (16:9 Output) -->
  <div class="stage-container">
    <div class="broadcast-stage" id="stage">

        <div class="profile-card">
          <div class="profile-img-wrapper" id="media-container">

            <button id="next-page">Next ▶</button>
          </div>
          <div>
            <button id="zoom-out">-</button>
            <button id="zoom-in">+</button>
          </div>
        </div>
        <div class="pdf-viewport">
          <canvas id="pdf-render"></canvas>
        </div>
      </div>

      <!-- Teks Running / Banner Bawah -->
      <div class="bottom-bar">
        <span>ribathdarusshohihain</span>

  <script>
    // --- PDF Render Logic ---
    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        scale = 1.2,
        canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d');

    const renderPage = num => {
      pageIsRendering = true;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = {
          canvasContext: ctx,
          viewport
        };

        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });

        document.getElementById('page-num').textContent = num;
      });
    };

    const queueRenderPage = num => {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    };

    // Load PDF
    document.getElementById('upload-pdf').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileReader = new FileReader();
        fileReader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then(pdf => {
            pdfDoc = pdf;
            document.getElementById('page-count').textContent = pdf.numPages;
            pageNum = 1;
            renderPage(pageNum);
          });
        };
        fileReader.readAsArrayBuffer(file);
      }
    });

    document.getElementById('prev-page').addEventListener('click', () => {
      if (!pdfDoc || pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (!pdfDoc) return;
      scale += 0.2;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (!pdfDoc || scale <= 0.6) return;
      scale -= 0.2;
      queueRenderPage(pageNum);
    });

    // --- Upload Foto Kyai ---
    document.getElementById('upload-photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('speaker-img').src = event.target.result;
          document.getElementById('speaker-img').style.display = 'block';
          document.getElementById('webcam-video').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // --- Gunakan Kamera / Webcam ---
    document.getElementById('btn-webcam').addEventListener('click', async () => {
      const videoEl = document.getElementById('webcam-video');
      const imgEl = document.getElementById('speaker-img');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        videoEl.srcObject = stream;
        videoEl.style.display = 'block';
        imgEl.style.display = 'none';
      } catch (err) {
        alert("Tidak dapat mengakses kamera: " + err.message);
      }
    });
  </script>
